name: Update internship listings

on:
  schedule:
    # Twice daily, ~8am and ~8pm Pacific (PDT; shifts 1h in PST)
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect new postings
        run: python3 run.py

      - name: Commit and push if changed
        run: |
          git config user.name "me-internship-tracker"
          git config user.email "me-internship-tracker@users.noreply.github.com"
          git add README.md jobs.json state.json runs.log
          git diff --cached --quiet || git commit -m "jobs: auto-update $(date -u +%F_%H%M_UTC)"
          git push
